<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daynote · Personal Work OS</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<!-- 顶部 -->

<header class="top">

<div>

<h1>
☁ Good Morning
</h1>

<p id="todayDate">
2026.07.27 Monday
</p>

</div>


<div class="mood">

<span>
🌱
</span>

<span>
Calm
</span>

</div>


</header>





<!-- 今日完成度 -->

<section class="card progress-card">


<div class="section-title">

今日完成度

</div>


<div class="progress-info">

<span id="completeCount">
0 / 0
</span>


<span id="completeRate">
0%
</span>


</div>


<div class="progress-bar">

<div id="progressLine"></div>

</div>


</section>







<!-- 今日重点 -->

<section class="card">


<div class="section-title">

⭐ 今日重点

</div>


<div id="focusList">


<button class="add-small">

＋ 添加今日重点

</button>


</div>


</section>







<!-- 今日待办 -->

<section class="card">


<div class="section-header">

<div class="section-title">

☁ 今日待办

</div>


<button id="addTaskBtn">

＋ 新任务

</button>


</div>



<div id="taskList">


<!-- JS生成任务 -->


</div>



</section>








<!-- 每日习惯 -->

<section class="card">


<div class="section-header">


<div class="section-title">

🌿 每日习惯

</div>


<button id="addRoutineBtn">

＋ 添加习惯

</button>


</div>



<div id="routineList">


</div>



</section>








<!-- 灵感收集 -->

<section class="card">


<div class="section-header">


<div class="section-title">

💡 灵感收集

</div>


<button id="addIdeaBtn">

＋ 新想法

</button>


</div>


<div id="ideaList">


</div>


</section>








<!-- 完成统计 -->

<section class="card">


<div class="section-title">

📈 完成任务总览

</div>



<div class="statistics">


<div>

<p>
今日完成
</p>

<strong id="todayDone">
0
</strong>

</div>



<div>

<p>
累计完成
</p>

<strong id="totalDone">
0
</strong>


</div>



<div>

<p>
专注时间
</p>

<strong id="focusTime">
0h
</strong>


</div>



</div>



</section>









<!-- 主题 -->

<section class="card">


<div class="section-title">

🎨 Theme Studio

</div>



<div class="theme-box">


<button data-theme="mint">
🍃 薄荷绿
</button>


<button data-theme="pink">
🌸 樱花粉
</button>


<button data-theme="purple">
💜 薰衣草紫
</button>


<button data-theme="blue">
☁ 天空蓝
</button>


<button data-theme="cream">
🍰 奶油拿铁
</button>



</div>



</section>









</div>









<!-- 新建任务弹窗 -->


<div class="modal hidden" id="taskModal">


<div class="modal-content">


<h2>
新建任务
</h2>



<label>
任务名称
</label>


<input id="taskName"
placeholder="例如：优化详情页">




<label>
项目</label>


<input id="taskProject"
placeholder="例如：bydoll">


<label>
分类
</label>


<div class="category-box">

<select id="taskCategory">

<option value="">
选择分类
</option>

</select>


<button type="button" id="manageCategoryBtn">
＋ 管理分类
</button>


</div>




<div class="time-row">


<div>

<label>
开始时间
</label>

<input type="time" id="startTime">

</div>



<div>

<label>
截止时间
</label>

<input type="time" id="endTime">

</div>


</div>







<label>

循环任务

</label>


<select id="repeatTask">


<option value="none">
不循环
</option>

<option value="daily">
每天
</option>

<option value="workday">
工作日
</option>

<option value="weekly">
每周
</option>

<option value="monthly">
每月
</option>


</select>







<label>

备注

</label>


<textarea id="taskNote"

placeholder="添加任务备注...">

</textarea>






<div class="modal-buttons">


<button id="cancelTask">

取消

</button>


<button id="saveTask">

保存

</button>



</div>



</div>


</div>









<!-- 习惯弹窗 -->


<div class="modal hidden" id="routineModal">


<div class="modal-content">


<h2>
新增每日习惯
</h2>


<input id="routineName"

placeholder="例如：英语学习30分钟">



<select id="routineRepeat">

<option>
每天
</option>

<option>
工作日
</option>

<option>
每周
</option>


</select>



<div class="modal-buttons">

<button id="cancelRoutine">

取消

</button>


<button id="saveRoutine">

保存

</button>


</div>


</div>


</div>








<script src="app.js"></script>


</body>


</html>
