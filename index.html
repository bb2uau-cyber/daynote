<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daynote</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<!-- 顶部 -->

<header class="top">


<div>

<h1>
☁ Good Morning
</h1>


<p id="todayDate"></p>


</div>



<div class="mood">

<span>
🍃
</span>

<span id="themeName">
Mint Cloud
</span>


</div>


</header>







<!-- 完成度 -->


<section class="card">


<h2>
今日完成度
</h2>


<div class="progress-info">


<span id="progressText">
0 / 0
</span>


<span id="progressPercent">
0%
</span>


</div>



<div class="progress-bar">

<div id="progressInner"></div>

</div>


</section>









<!-- 今日重点 -->


<section class="card">


<div class="section-header">


<h2>
⭐ 今日重点
</h2>


<button id="addFocusBtn">
＋ 添加
</button>


</div>


<div id="focusList"></div>


</section>









<!-- 今日待办 -->


<section class="card">


<div class="section-header">


<h2>
☁ 今日待办
</h2>


<button id="addTaskBtn">
＋ 新任务
</button>


</div>


<div id="taskList"></div>


</section>









<!-- 每日习惯 -->


<section class="card">


<div class="section-header">


<h2>
🌿 每日习惯
</h2>


<button id="addRoutineBtn">
＋ 添加
</button>


</div>


<div id="routineList"></div>


</section>









<!-- 灵感 -->


<section class="card">


<div class="section-header">


<h2>
💡 灵感收集
</h2>


<button id="addIdeaBtn">
＋ 新想法
</button>


</div>


<div id="ideaList"></div>


</section>









<!-- 数据 -->


<section class="card">


<h2>
📈 工作复盘
</h2>


<div class="statistics">


<div>

<p>
今日完成
</p>

<strong id="todayDone">
0
</strong>

</div>



<div>

<p>
累计完成
</p>

<strong id="allDone">
0
</strong>

</div>



<div>

<p>
任务数量
</p>

<strong id="taskNumber">
0
</strong>

</div>


</div>


</section>









<!-- 分类 -->


<section class="card">


<div class="section-header">


<h2>
🏷 分类管理
</h2>


<button id="addCategoryBtn">
＋ 新分类
</button>


</div>


<div id="categoryList"></div>


</section>









<!-- 主题 -->


<section class="card">


<h2>
🎨 Theme Studio
</h2>


<div class="theme-grid">


<button data-theme="mint">
🍃 Mint Cloud
</button>


<button data-theme="sakura">
🌸 Sakura Milk
</button>


<button data-theme="lavender">
💜 Lavender Mist
</button>


<button data-theme="blue">
☁ Baby Blue
</button>


<button data-theme="vanilla">
🧁 Vanilla Cream
</button>


<button data-theme="aqua">
🫧 Aqua Glass
</button>


<button data-theme="peach">
🍑 Peach Soda
</button>


<button data-theme="moon">
🌙 Moon Purple
</button>


<button data-theme="ice">
🩵 Ice Blue
</button>


<button data-theme="lilac">
🪻 Lilac Pink
</button>


<button data-theme="pearl">
🐚 Pearl White
</button>


<button data-theme="teddy">
🧸 Teddy Beige
</button>


</div>


</section>





</div>





<!-- =================
任务弹窗
================= -->


<div class="modal hidden" id="taskModal">


<div class="modal-box">


<h2>
新建任务
</h2>


<input id="taskName"
placeholder="任务名称">


<input id="taskProject"
placeholder="所属项目">


<select id="taskCategory">

</select>



<select id="taskPriority">


<option>
⭐ 高
</option>


<option>
普通
</option>


<option>
低
</option>


</select>



<div class="time-row">


<input type="time" id="taskStart">


<input type="time" id="taskEnd">


</div>



<select id="taskRepeat">


<option value="none">
不循环
</option>


<option value="daily">
每天
</option>


<option value="workday">
工作日
</option>


<option value="weekly">
每周
</option>


<option value="monthly">
每月
</option>


</select>



<textarea id="taskNote"
placeholder="备注">
</textarea>



<div class="modal-buttons">


<button id="closeTask">
取消
</button>


<button id="saveTask">
保存
</button>


</div>


</div>


</div>
<!-- =================
每日习惯弹窗
================= -->


<div class="modal hidden" id="routineModal">


<div class="modal-box">


<h2>
新增每日习惯
</h2>


<input 
id="routineName"
placeholder="例如：英语学习30分钟">


<div class="modal-buttons">


<button id="closeRoutine">
取消
</button>


<button id="saveRoutine">
保存
</button>


</div>


</div>


</div>









<!-- =================
分类弹窗
================= -->


<div class="modal hidden" id="categoryModal">


<div class="modal-box">


<h2>
创建分类
</h2>


<input 
id="categoryIcon"
placeholder="输入图标，例如 🎨">



<input 
id="categoryName"
placeholder="分类名称">



<div class="modal-buttons">


<button id="closeCategory">
取消
</button>



<button id="saveCategory">
保存
</button>


</div>


</div>


</div>









<!-- =================
灵感弹窗
================= -->


<div class="modal hidden" id="ideaModal">


<div class="modal-box">


<h2>
记录灵感
</h2>



<textarea
id="ideaText"
placeholder="写下你的想法...">
</textarea>



<div class="modal-buttons">


<button id="closeIdea">
取消
</button>


<button id="saveIdea">
保存
</button>


</div>


</div>


</div>









<!-- =================
今日重点弹窗
================= -->


<div class="modal hidden" id="focusModal">


<div class="modal-box">


<h2>
今日重点
</h2>



<textarea
id="focusText"
placeholder="写下今天最重要的事情...">
</textarea>



<div class="modal-buttons">


<button id="closeFocus">
取消
</button>


<button id="saveFocus">
保存
</button>


</div>


</div>


</div>









<script src="app.js"></script>


</body>


</html>
