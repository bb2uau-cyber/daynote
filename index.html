<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Daynote · Personal Work OS
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">


<!-- 顶部 -->

<header class="top">


<div>

<h1>
☁ Good Morning
</h1>


<p id="todayDate">
2026.07.27 Monday
</p>


</div>



<div class="mood">

<span id="moodIcon">
🍃
</span>

<span id="moodText">
Mint Cloud
</span>


</div>


</header>







<!-- 完成度 -->


<section class="card">


<div class="section-title">

今日完成度

</div>


<div class="progress-info">


<span id="completeCount">
0 / 0
</span>


<span id="completeRate">
0%
</span>


</div>



<div class="progress-bar">


<div id="progressLine">

</div>


</div>



</section>








<!-- 今日重点 -->


<section class="card">


<div class="section-header">


<div class="section-title">

⭐ 今日重点

</div>



<button onclick="addFocus()">

＋ 添加

</button>


</div>



<div id="focusList">


</div>


</section>









<!-- 今日待办 -->


<section class="card">


<div class="section-header">


<div class="section-title">

☁ 今日待办

</div>



<button onclick="openTaskModal()">

＋ 新任务

</button>


</div>



<div id="taskList">


</div>


</section>









<!-- 每日习惯 -->


<section class="card">


<div class="section-header">


<div class="section-title">

🌿 每日习惯

</div>



<button onclick="openRoutineModal()">

＋ 添加

</button>


</div>



<div id="routineList">

</div>


</section>









<!-- 灵感 -->


<section class="card">


<div class="section-header">


<div class="section-title">

💡 灵感收集

</div>



<button onclick="addIdea()">

＋ 新想法

</button>


</div>



<div id="ideaList">


</div>


</section>









<!-- 工作统计 -->


<section class="card">


<div class="section-title">

📈 工作复盘

</div>



<div class="statistics">


<div>

<p>
今日完成
</p>

<strong id="todayDone">
0
</strong>


</div>



<div>

<p>
累计完成
</p>

<strong id="totalDone">
0
</strong>


</div>




<div>

<p>
任务数量
</p>


<strong id="taskTotal">
0
</strong>


</div>


</div>



</section>









<!-- 分类管理 -->


<section class="card">


<div class="section-header">


<div class="section-title">

🏷 分类管理

</div>


<button onclick="openCategoryModal()">

＋ 新分类

</button>


</div>



<div id="categoryList">


</div>



</section>









<!-- 主题 -->


<section class="card">


<div class="section-title">

🎨 Theme Studio

</div>



<div class="theme-grid">



<button onclick="changeTheme('mint')">

🍃 Mint Cloud

</button>


<button onclick="changeTheme('sakura')">

🌸 Sakura Milk

</button>


<button onclick="changeTheme('lavender')">

💜 Lavender Mist

</button>


<button onclick="changeTheme('babyblue')">

☁ Baby Blue

</button>


<button onclick="changeTheme('vanilla')">

🧁 Vanilla Cream

</button>


<button onclick="changeTheme('aqua')">

🫧 Aqua Glass

</button>


<button onclick="changeTheme('peach')">

🍑 Peach Soda

</button>


<button onclick="changeTheme('moon')">

🌙 Moon Purple

</button>


<button onclick="changeTheme('ice')">

🩵 Ice Blue

</button>


<button onclick="changeTheme('lilac')">

🪻 Lilac Pink

</button>


<button onclick="changeTheme('pearl')">

🐚 Pearl White

</button>


<button onclick="changeTheme('teddy')">

🧸 Teddy Beige

</button>



</div>


</section>





</div>









<!-- ==================
任务弹窗
================== -->


<div class="modal hidden" id="taskModal">


<div class="modal-box">


<h2>
新建任务
</h2>



<label>
任务名称
</label>


<input id="taskName"
placeholder="例如：优化吸盘挂钩详情页">





<label>
项目
</label>


<input id="taskProject"
placeholder="例如：bydoll">





<label>
分类
</label>


<select id="taskCategory">

</select>





<label>
优先级
</label>


<select id="taskPriority">


<option>
⭐ 高
</option>


<option>
普通
</option>


<option>
低
</option>


</select>






<div class="time-row">


<div>

<label>
开始时间
</label>


<input 
type="time"
id="startTime">

</div>



<div>


<label>
截止时间
</label>


<input
type="time"
id="endTime">


</div>


</div>







<label>
循环任务
</label>


<select id="taskRepeat">


<option value="none">
不循环
</option>


<option value="daily">
每天
</option>


<option value="workday">
工作日
</option>


<option value="weekly">
每周
</option>


<option value="monthly">
每月
</option>


</select>







<label>
备注
</label>


<textarea 
id="taskNote"
placeholder="记录任务细节...">

</textarea>





<div class="modal-buttons">


<button onclick="closeModal('taskModal')">

取消

</button>



<button onclick="saveTask()">

保存

</button>



</div>



</div>


</div>









<!-- ==================
习惯弹窗
================== -->


<div class="modal hidden" id="routineModal">


<div class="modal-box">


<h2>
新增每日习惯
</h2>


<input
id="routineName"
placeholder="例如：英语学习30分钟">



<select id="routineRepeat">


<option>
每天
</option>


<option>
工作日
</option>


<option>
每周
</option>



</select>



<div class="modal-buttons">


<button onclick="closeModal('routineModal')">

取消

</button>



<button onclick="saveRoutine()">

保存

</button>


</div>


</div>


</div>









<!-- ==================
分类弹窗
================== -->


<div class="modal hidden" id="categoryModal">


<div class="modal-box">


<h2>
创建分类
</h2>



<input
id="categoryIcon"
placeholder="输入图标，例如 🎨">


<input
id="categoryName"
placeholder="分类名称">



<div class="modal-buttons">


<button onclick="closeModal('categoryModal')">

取消

</button>


<button onclick="saveCategory()">

保存

</button>


</div>


</div>


</div>









<script src="app.js"></script>


</body>


</html>
