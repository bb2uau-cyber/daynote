<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Daynote · Life Planner
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<!-- 顶部 -->

<header class="header">


<div>

<h1 id="greeting">
🌙 Good Evening
</h1>


<p id="date">
2026年7月27日
</p>


<p id="subtitle">
今天辛苦啦，记录一下吧
</p>

</div>



<div class="theme-tag">

🍃 Mint Diary

</div>


</header>







<!-- 今日心情 -->

<section class="card">


<h2>
🌷 今日心情
</h2>


<div class="mood-list">


<button onclick="setMood('🌸 开心')">
🌸
</button>


<button onclick="setMood('🌱 平静')">
🌱
</button>


<button onclick="setMood('☁ 普通')">
☁
</button>


<button onclick="setMood('🌧 疲惫')">
🌧
</button>


<button onclick="setMood('🌙 emo')">
🌙
</button>


</div>



<p id="moodText">
今天是什么心情呢？
</p>


</section>







<!-- 今日重点 -->

<section class="card">


<div class="title-row">


<h2>
⭐ 今日重点
</h2>


</div>



<div class="input-row">


<input
id="focusInput"
placeholder="今天最重要的一件事">


<button onclick="addFocus()">
添加
</button>


</div>



<div id="focusList">

</div>


</section>








<!-- 今日待办 -->

<section class="card">


<h2>
☁ 今日待办
</h2>



<div class="input-row">


<input
id="taskInput"
placeholder="输入待办任务">


<button onclick="addTask()">
添加
</button>


</div>



<div id="taskList">

</div>


</section>









<!-- 每日习惯 -->

<section class="card">


<h2>
🌿 每日习惯
</h2>


<div id="habitList">


<div class="habit">

☐ 英语学习

</div>


<div class="habit">

☐ 运动

</div>


<div class="habit">

☐ 整理素材

</div>


</div>


</section>









<!-- 灵感 -->

<section class="card">


<h2>
💡 灵感收集
</h2>



<textarea
id="ideaInput"
placeholder="记录突然想到的想法...">
</textarea>


<button onclick="saveIdea()">
保存灵感
</button>



<div id="ideaList">

</div>


</section>








<!-- 今日记录 -->

<section class="card">


<h2>
📖 今日记录
</h2>



<textarea
id="noteInput"
placeholder="写下今天发生的小事...">
</textarea>



<button onclick="saveNote()">
保存记录
</button>



<div id="noteShow">

</div>



</section>








<!-- 主题 -->


<section class="card">


<h2>
🎨 Theme Room
</h2>



<div class="theme-list">


<button onclick="changeTheme('mint')">
🍃 薄荷绿
</button>


<button onclick="changeTheme('pink')">
🌸 樱花粉
</button>


<button onclick="changeTheme('purple')">
💜 薰衣草
</button>


<button onclick="changeTheme('blue')">
🩵 云朵蓝
</button>



</div>


</section>






</div>



<script src="app.js"></script>


</body>

</html>
